name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install lint tools
        run: pip install flake8 black isort
      # Scoped to app/ + tests/ (Phase 2 additions). src/ is Phase 1 code
      # that predates this lint config and hasn't been reformatted -- see
      # docs/deployment.md / README for the reasoning; flagged rather than
      # silently rewriting already-graded Phase 1 files.
      - name: flake8
        run: flake8 app tests
      - name: black --check
        run: black --check app tests
      - name: isort --check-only
        run: isort --check-only app tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-api.txt') }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install pytest pytest-cov httpx
      - name: Run tests
        # Tests use synthetic fixtures (tests/conftest.py) -- no dependency
        # on the real DVC-tracked data/model, so this runs on every PR fast.
        run: pytest tests/ -v --cov=app --cov=src --cov-report=xml --cov-report=term
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Check model artifact is present
        id: model_check
        run: |
          if [ -f models/model.pkl ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::models/model.pkl is not committed yet -- skipping Docker build validation. See docs/deployment.md (run 'dvc repro' and commit the model)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        if: steps.model_check.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build image (validation only, no push)
        if: steps.model_check.outputs.present == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dropout-api:ci
